<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sober Dice</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --text: #ffffff;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.18);
      --yellow: #ffe600;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 30%),
        radial-gradient(circle at bottom, rgba(255,230,0,0.08), transparent 25%),
        #000;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .pawn-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      z-index: 0;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='[w3.org](http://www.w3.org/2000/svg)' width='140' height='140' viewBox='0 0 140 140'><text x='28' y='100' font-size='86' fill='white'>♙</text></svg>");
      background-size: 140px 140px;
      background-repeat: repeat;
      filter: drop-shadow(0 0 6px white);
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(92vw, 950px);
      padding: 32px 24px;
      text-align: center;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.08),
        0 0 80px rgba(255, 230, 0, 0.06),
        inset 0 1px 0 rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255,255,255,0.45),
        0 0 18px rgba(255,230,0,0.15);
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #d8d8d8;
      font-size: 1rem;
      line-height: 1.5;
    }

    .button-wrap {
      margin-bottom: 30px;
    }

    #rollButton {
      background: linear-gradient(180deg, #fff78a, #ffe600 55%, #d4b900 100%);
      color: #000;
      border: 0;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow:
        0 0 18px rgba(255, 230, 0, 0.45),
        0 0 45px rgba(255, 230, 0, 0.25),
        inset 0 2px 0 rgba(255,255,255,0.7),
        inset 0 -3px 8px rgba(0,0,0,0.2);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
    }

    #rollButton:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.04);
      box-shadow:
        0 0 22px rgba(255, 230, 0, 0.6),
        0 0 60px rgba(255, 230, 0, 0.3),
        inset 0 2px 0 rgba(255,255,255,0.7),
        inset 0 -3px 8px rgba(0,0,0,0.2);
    }

    #rollButton:active {
      transform: scale(0.98);
    }

    #rollButton:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .dice-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      max-width: 760px;
      margin: 0 auto 24px;
    }

    .square {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      background: #111;
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 14px 25px rgba(0,0,0,0.55),
        0 0 24px rgba(255,255,255,0.08);
      overflow: hidden;
      transition:
        transform 0.14s ease,
        box-shadow 0.14s ease,
        background 0.12s linear;
    }

    .square::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.35), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,0.12), transparent 60%);
      pointer-events: none;
    }

    .square::after {
      content: "●";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.92);
      font-size: clamp(2rem, 6vw, 4rem);
      text-shadow: 0 0 12px rgba(255,255,255,0.45);
      pointer-events: none;
    }

    .square.active {
      transform: translateY(-4px) scale(1.03);
    }

    .result {
      min-height: 30px;
      font-size: 1.08rem;
      color: #f2f2f2;
      text-shadow: 0 0 10px rgba(255,255,255,0.12);
    }

    .legend {
      margin-top: 18px;
      color: #bfbfbf;
      font-size: 0.95rem;
    }

    .footer-note {
      margin-top: 8px;
      color: #8d8d8d;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .dice-row {
        gap: 12px;
      }

      .card {
        padding: 26px 16px;
      }
    }

    @media (max-width: 520px) {
      .dice-row {
        grid-template-columns: repeat(2, 1fr);
        max-width: 360px;
      }

      #rollButton {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="pawn-bg"></div>

  <div class="container">
    <div class="card">
      <h1>Sober Dice</h1>
      <p class="subtitle">
        Hit <strong>Roll It</strong> to shuffle through red, orange, yellow, green, and purple,
        then stop on 4 random side-by-side dice squares.
      </p>

      <div class="button-wrap">
        <button id="rollButton">Roll It</button>
      </div>

      <div class="dice-row">
        <div class="square" data-color-name="blank"></div>
        <div class="square" data-color-name="blank"></div>
        <div class="square" data-color-name="blank"></div>
        <div class="square" data-color-name="blank"></div>
      </div>

      <div class="result" id="resultText">Ready to roll.</div>

      <div class="legend">Possible colors: red, orange, yellow, green, purple</div>
      <div class="footer-note">Duplicates are allowed - 1, 2, 3, or all 4 can match.</div>
    </div>
  </div>
